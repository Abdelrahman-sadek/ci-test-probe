<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library Assistant — Staff</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<a class="skip" href="#file">Skip to upload</a>
<header class="bar"><h1>Library Assistant — Staff</h1></header>
<main id="main">
  <p class="note">Add or update pages without coding. With single sign-on you are recognised automatically; otherwise paste the admin key.</p>
  <section class="panel" aria-labelledby="h-key">
    <h2 id="h-key">Access</h2>
    <label for="key">Admin key (optional with SSO)</label>
    <input id="key" type="password" autocomplete="off">
  </section>
  <section class="panel" aria-labelledby="h-up">
    <h2 id="h-up">Add a page or document</h2>
    <form id="up">
      <label for="file">File (Markdown, text, HTML, PDF, image — up to 20 MB)</label>
      <input id="file" type="file" required accept=".md,.txt,.html,.htm,.pdf,.png,.jpg,.jpeg">
      <label for="title">Title</label>
      <input id="title" maxlength="200">
      <label for="url">Official URL (must be on an approved domain)</label>
      <input id="url" type="url" maxlength="500" placeholder="https://library.aucegypt.edu/…">
      <label for="access">Who can see it</label>
      <select id="access"><option value="public">Everyone</option><option value="student">Students</option><option value="faculty">Faculty</option><option value="staff">Library staff</option></select>
      <p class="row"><button type="submit">Upload and index</button></p>
    </form>
  </section>
  <section class="panel" aria-labelledby="h-rev">
    <h2 id="h-rev">Changed sources waiting for review</h2>
    <ul id="review"></ul>
    <p class="row"><button type="button" id="refresh" class="ghost">Refresh</button></p>
  </section>
  <section class="panel" aria-labelledby="h-stats">
    <h2 id="h-stats">Usage</h2>
    <pre id="stats"></pre>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="/static/admin.js"></script>
</body>
</html>
