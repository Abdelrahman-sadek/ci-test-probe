[project]
name = "agentkit"
version = "0.2.0"
description = "Lean AI agents + OCR + hybrid RAG + guarded AUC Library chat (Arabic/English)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["anthropic>=1.0", "pymupdf>=1.24"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dense = ["sentence-transformers>=3"]          # BGE-M3 embeddings + bge-reranker-v2-m3 (AGENTKIT_DENSE=1 / AGENTKIT_RERANK=1)
tesseract = ["pytesseract", "pillow"]
dev = ["pytest", "mcp>=1.2"]

[project.scripts]
agentkit = "agentkit.cli:main"

[tool.setuptools]
packages = ["agentkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
