name: Agents CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      - name: Lint agents, skills, marketplace
        run: scripts/lint-agents.sh
      - name: Unit, API, security and scale tests
        run: pytest -q --ignore=tests/test_a11y.py
      - name: End-to-end offline eval + red-team (fail below thresholds)
        run: |
          agentkit ingest knowledge/auc-library/pages
          agentkit eval --min-pass 0.95 --min-recall 0.9
          agentkit redteam
          agentkit --index data/index.db ingest knowledge/auc-library/pages
          agentkit --index data/index.db eval --min-pass 0.95 --min-recall 0.9
          agentkit test-agents
      - name: Dev and held-out evals (reported, no threshold; see docs/EVALUATION-LOG.md)
        run: |
          agentkit --index data/index.db eval --set dev || true
          agentkit --index data/index.db eval --set heldout || true
          python - <<'PY'
          from pathlib import Path
          from agentkit.harvest import harvest
          pages = {False: Path("samples/fixtures/oai/page1.xml").read_bytes(), True: Path("samples/fixtures/oai/page2.xml").read_bytes()}
          def fetch(url):
              if "viewcontent" in url: raise OSError("offline")
              return pages["resumptionToken=page2token" in url]
          print(harvest("https://fount.aucegypt.edu/do/oai/", "data/theses", fetch=fetch))
          PY
          agentkit --index data/theses.db ingest knowledge/auc-library/pages data/theses && agentkit --index data/theses.db approve
          agentkit --index data/theses.db eval --set theses || true
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with: {name: eval-reports, path: data/*-report.md}
      - name: Search latency (SQLite, 20k chunks, p95 ≤ 300 ms)
        if: matrix.python == '3.12'
        run: python scripts/bench_search.py --chunks 20000 --backends sqlite --target-p95-ms 300
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara fonts-dejavu-core
      - run: pip install -e ".[dev,tesseract]"
      - name: OCR bench (synthetic EN/AR, mean CER ≤ 0.2) and Tesseract tests
        run: |
          python scripts/ocr_bench.py --engine tesseract --target-cer 0.2
          AGENTKIT_OCR=tesseract pytest -q tests/test_round1.py -k diacritized
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev,a11y]" && python -m playwright install --with-deps chromium
      - name: axe-core WCAG 2.2 AA in Chromium (English + Arabic RTL)
        run: pytest -q tests/test_a11y.py
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit bandit cyclonedx-bom
      - name: Vulnerability audit of the locked dependencies
        run: pip-audit -r requirements.lock
      - name: Static analysis (bandit, medium+)
        run: bandit -q -r agentkit -ll
      - name: SBOM (CycloneDX)
        run: cyclonedx-py requirements requirements.lock -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: {name: sbom, path: sbom.cdx.json}
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Validate Claude Code plugin marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
      - name: Install script smoke test
        run: |
          HOME=$(mktemp -d) scripts/install.sh claude
          scripts/install.sh cursor && scripts/install.sh agents-md
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and smoke-test /healthz
        run: |
          docker build -t agentkit .
          docker run -d --name ak -p 8000:8000 agentkit
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 2; done
          curl -fsS -X POST localhost:8000/api/ask -H 'Content-Type: application/json' -d '{"question":"Can alumni borrow books?"}'
